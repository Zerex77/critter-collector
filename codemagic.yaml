# Codemagic builds the iPhone app on a cloud Mac, so no Mac is needed.
# Every push to the main branch builds the app and uploads it to TestFlight.
workflows:
  ios-release:
    name: Critter Collector iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      # Must match the name you give the API key in Codemagic > Team settings > Integrations.
      app_store_connect: Critter Collector
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.zacharyelam.crittercollector
      vars:
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
        APP_VERSION: "1.0.0"
      node: 20
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install dependencies
        script: npm install

      - name: Create the iOS project
        script: |
          if [ ! -d ios ]; then npx cap add ios; fi

      - name: Generate icons and splash screens
        script: npx @capacitor/assets generate --ios

      - name: Copy the game and plugins into the iOS project
        script: npx cap sync ios

      - name: iPhone only, portrait only, skip the encryption question
        script: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Delete :ITSAppUsesNonExemptEncryption" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"
          sed -i '' 's/TARGETED_DEVICE_FAMILY = "1,2";/TARGETED_DEVICE_FAMILY = 1;/g' ios/App/App.xcodeproj/project.pbxproj

      - name: Set version and build number
        script: |
          PBX=ios/App/App.xcodeproj/project.pbxproj
          sed -i '' "s/MARKETING_VERSION = [^;]*;/MARKETING_VERSION = $APP_VERSION;/g" "$PBX"
          sed -i '' "s/CURRENT_PROJECT_VERSION = [^;]*;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/g" "$PBX"

      - name: Set up code signing
        script: xcode-project use-profiles

      - name: Build the app
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
